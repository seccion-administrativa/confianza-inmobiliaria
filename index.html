<!DOCTYPE html>
<html lang="es-CL" data-theme="dark" data-accent="dorado">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181c21">
  <meta name="description" content="Centro de tutoriales para ejecutivos de Confianza Inmobiliaria">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:title" content="Confianza · Centro de tutoriales">
  <meta property="og:description" content="Tutoriales en video para ejecutivos y vendedores">
  <meta property="og:image" content="logo.png">
  <title>Confianza · Tutoriales</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html {
  --dorado:#f59e0b; --verde:#10b981; --azul:#3b82f6; --rojo:#f43f5e;
  --accent:#f59e0b; --accent-ink:#0a1530; --radius:18px;
  --sp-xs:.5rem; --sp-sm:.75rem; --sp-md:1rem; --sp-lg:1.5rem; --sp-xl:2.25rem;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
html[data-accent="dorado"] { --accent:#f59e0b; --accent-ink:#1a1204; }
html[data-accent="verde"] { --accent:#10b981; --accent-ink:#022c22; }
html[data-accent="azul"] { --accent:#3b82f6; --accent-ink:#0a1530; }
html[data-theme="dark"] {
  --page:#0b0d10; --bg1:#111418; --bg2:#181c21; --surface:#1d2228; --field:#15191e;
  --border:#333a42; --title:#fff; --txt:#e6e9ee; --muted:#9aa3ad;
  --shadow:0 20px 44px -18px rgba(0,0,0,.75);
}
html[data-theme="light"] {
  --page:#eef1f8; --bg1:#f5f7fc; --bg2:#fff; --surface:#fff; --field:#f4f6fc;
  --border:#e2e6f0; --title:#0d1b3e; --txt:#334155; --muted:#64748b;
  --shadow:0 16px 34px -20px rgba(13,27,62,.28);
}
body {
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--page); color:var(--txt); overflow-x:clip;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
:focus-visible { outline:2px solid var(--title); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
@media (hover: hover) { button:hover, a:hover { opacity:.85; } }

.app { max-width:480px; margin:0 auto; min-height:100vh;
  background:radial-gradient(120% 60% at 50% -10%, var(--bg2), var(--bg1) 60%, var(--page));
}
header { position:sticky; top:0; z-index:100; padding:18px 20px 15px;
  background:var(--bg2); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.logo { height:40px; width:auto; }
.gear-btn {
  width:42px; height:42px; border-radius:13px; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; font-size:18px;
  display:flex; align-items:center; justify-content:center;
  transition:all 100ms var(--ease-out);
}
.gear-btn:active { transform:translateY(1px); }
.search-container { position:relative; }
.search-input {
  width:100%; padding:12px 15px 12px 40px; border-radius:12px;
  background:var(--field); border:1px solid var(--border); color:var(--txt); font-size:16px;
  transition:all 150ms var(--ease-out);
}
.search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }

.categories { display:flex; gap:8px; overflow-x:auto; padding:14px 20px 0; margin-bottom:12px;
  scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
}
.chip { padding:7px 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  color:var(--txt); font-size:13px; font-weight:700; white-space:nowrap; cursor:pointer;
  transition:all 150ms var(--ease-out);
}
.chip.active { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }

.results { padding:14px 20px 60px; }
.result-count { font-size:12px; color:var(--muted); margin-bottom:12px; }
.result-list { display:flex; flex-direction:column; gap:16px; }

.card {
  border-radius:18px; border:1px solid var(--border); background:var(--surface);
  padding:18px; box-shadow:var(--shadow); cursor:pointer;
  transition:all 180ms var(--ease-out); position:relative;
}
.card:active { transform:translateY(-3px); }
.card-thumb { position:relative; width:100%; aspect-ratio:16/9; background:#000;
  border-radius:12px; overflow:hidden; margin-bottom:12px;
}
.card-thumb img { width:100%; height:100%; object-fit:cover; }
.card-thumb-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.3);
}
.card-thumb-overlay::after { content:'▶'; font-size:32px; color:#fff; }
.card-category { display:inline-block; font-size:11px; font-weight:700; padding:4px 10px;
  border-radius:999px; background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);
  margin-bottom:8px;
}
.card-title { font-size:16px; font-weight:800; line-height:1.2; margin-bottom:6px; color:var(--title); }
.card-desc { font-size:13px; color:var(--txt); line-height:1.4; margin-bottom:8px; }
.card-tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:11px; padding:4px 8px; border-radius:6px; background:var(--border); color:var(--muted); }

.empty-state { text-align:center; padding:64px 24px; }
.empty-state-icon { font-size:48px; margin-bottom:16px; }
.empty-state-title { font-size:17px; font-weight:700; color:var(--title); margin-bottom:8px; }
.empty-state-text { font-size:13px; color:var(--muted); margin-bottom:20px; }
.btn-primary { padding:12px 14px; border-radius:12px; min-height:44px;
  background:var(--accent); color:var(--accent-ink); border:none; font-size:13.5px; font-weight:700;
  cursor:pointer; transition:all 100ms var(--ease-out);
}
.btn-primary:active { transform:translateY(1px); }

.modal { display:none; position:fixed; inset:0; background:rgba(3,7,18,.7); z-index:200;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.modal.open { display:flex; align-items:flex-end; }
.modal-content { width:100%; max-width:480px; max-height:90vh; background:var(--bg2);
  border-radius:22px 22px 0 0; padding:20px 18px 26px; overflow-y:auto;
  animation:slideUp 220ms var(--ease-out);
}
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

.ficha { display:none; position:fixed; inset:0; background:var(--page); z-index:150; overflow-y:auto; }
.ficha.open { display:block; }
.ficha-head { position:sticky; top:0; z-index:10; padding:12px 20px; background:var(--bg2);
  border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
}
.ficha-body { max-width:640px; margin:0 auto; padding:20px; }
.player { width:100%; aspect-ratio:16/9; background:#000; border-radius:18px;
  display:flex; align-items:center; justify-content:center; margin-bottom:20px; position:relative;
}
.player iframe { width:100%; height:100%; border:none; border-radius:18px; }
.player-facade { cursor:pointer; width:100%; height:100%; display:flex; align-items:center;
  justify-content:center;
}
.player-facade::after { content:'▶'; font-size:56px; color:#fff; }

.spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

footer { text-align:center; padding:20px 18px 30px; font-size:11px; color:var(--muted); }

@media (min-width: 900px) {
  .app { max-width:1200px; display:grid; grid-template-columns:320px 1fr;
    grid-template-areas:"header header" "sidebar main" "footer footer"; min-height:100vh;
  }
  header { grid-area:header; position:static; }
  .categories { grid-area:sidebar; padding:14px 16px; margin-bottom:0; flex-direction:column; }
  .results { grid-area:main; padding:14px 30px 60px; }
  .result-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; }
  .chip { width:100%; }
}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <img src="logo.png" alt="Confianza" class="logo">
      <button class="gear-btn" id="gearBtn" title="Configuración">⚙️</button>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar tutorial..." autocomplete="off" spellcheck="false">
    </div>
  </header>

  <div class="categories" id="categoryContainer"></div>

  <main class="results" id="main">
    <div style="text-align:center; padding:40px 20px;">
      <div class="spinner" style="margin:0 auto;"></div>
      <p style="margin-top:16px; color:var(--muted); font-size:13px;">Cargando tutoriales...</p>
    </div>
  </main>

  <footer>
    <p style="margin-bottom:8px;">Confianza Inmobiliaria · Centro de Tutoriales</p>
    <p style="color:var(--muted);">Creada por Eduardo Pérez · <a href="https://wa.me/56927690949?text=Soporte%20app%20tutoriales" style="color:var(--accent); text-decoration:none;">Soporte WhatsApp</a></p>
  </footer>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h2 style="font-size:17px; font-weight:800; margin-bottom:20px; color:var(--title);">Configuración</h2>

    <div style="margin-bottom:20px;">
      <h3 style="font-size:12px; font-weight:700; margin-bottom:8px; color:var(--muted); text-transform:uppercase;">Tema</h3>
      <div style="display:flex; gap:8px;">
        <button class="chip" id="themeDark" style="flex:1;">🌙 Oscuro</button>
        <button class="chip" id="themeLight" style="flex:1;">☀️ Claro</button>
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <h3 style="font-size:12px; font-weight:700; margin-bottom:8px; color:var(--muted); text-transform:uppercase;">Acento</h3>
      <div style="display:flex; gap:8px;">
        <button class="chip" id="accentGold" style="flex:1;">🟡 Dorado</button>
        <button class="chip" id="accentGreen" style="flex:1;">🟢 Verde</button>
        <button class="chip" id="accentBlue" style="flex:1;">🔵 Azul</button>
      </div>
    </div>

    <button class="btn-primary" style="width:100%; margin-bottom:12px;" id="installBtn">📲 Instalar app</button>
    <button class="btn-primary" style="width:100%;" id="closeSettings">Cerrar</button>
  </div>
</div>

<div class="ficha" id="ficha">
  <div class="ficha-head">
    <button onclick="history.back()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--txt);">←</button>
    <span style="flex:1;"></span>
    <button onclick="closeFicha()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--txt);">✕</button>
  </div>
  <div class="ficha-body">
    <div class="player" id="playerContainer"></div>
    <h1 id="fichaTitle" style="font-size:20px; font-weight:800; margin:20px 0 8px; color:var(--title);"></h1>
    <div id="fichaMeta" style="display:flex; align-items:center; gap:12px; margin-bottom:20px; font-size:12px; color:var(--muted);"></div>
    <p id="fichaDesc" style="font-size:14px; line-height:1.6; margin-bottom:20px; color:var(--txt);"></p>
    <div id="fichaPasos" style="margin-bottom:20px;"></div>
    <div id="fichaAcciones" style="display:flex; gap:8px; margin-bottom:20px;"></div>
    <div id="fichaRelacionados" style="margin-bottom:40px;"></div>
  </div>
</div>

<script>
// Estado
const st = {
  tutoriales: [],
  sinonimos: {},
  categoryIdx: {},
  filtros: { q: '', cat: '' },
  tema: 'dark',
  acento: 'dorado',
  install: null,
  fichaActual: null,
};

// Cargar config
function loadConfig() {
  try {
    const cfg = JSON.parse(localStorage.getItem('confianza_tut_cfg_v1') || '{}');
    if (cfg.tema) st.tema = cfg.tema;
    if (cfg.acento) st.acento = cfg.acento;
  } catch {}
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', st.tema);
  document.documentElement.setAttribute('data-accent', st.acento);
  saveConfig();
}

function saveConfig() {
  try {
    localStorage.setItem('confianza_tut_cfg_v1', JSON.stringify({ tema: st.tema, acento: st.acento }));
  } catch {}
}

// Normalización
function norm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ñ/g, 'n').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

// Escape HTML
function esc(s) {
  const m = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":"&#39;" };
  return (s || '').replace(/[&<>"']/g, c => m[c]);
}

// Cargar datos
async function loadData() {
  try {
    const res = await fetch('data/tutoriales.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    st.tutoriales = data.tutoriales || [];
    st.categoryIdx = {};
    (data.categorias || []).forEach(c => { st.categoryIdx[c.id] = c; });

    try {
      const sinRes = await fetch('data/sinonimos.json?t=' + Date.now(), { cache: 'no-store' });
      if (sinRes.ok) {
        const sinData = await sinRes.json();
        sinData.grupos.forEach(g => {
          g.forEach(t => { st.sinonimos[t] = g; });
        });
      }
    } catch {}

    render();
    handleHash();
  } catch (err) {
    document.getElementById('main').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">❌</div>' +
      '<h2 class="empty-state-title">Error al cargar</h2>' +
      '<p class="empty-state-text">' + esc(err.message) + '</p>' +
      '<button class="btn-primary" onclick="location.reload()">Reintentar</button></div>';
  }
}

// Buscador simple (fase 1)
function search(q) {
  const qnorm = norm(q);
  if (!qnorm) return st.tutoriales.filter(t => t.estado === 'publicado');

  return st.tutoriales.filter(t => {
    if (t.estado !== 'publicado') return false;
    const busqueda = norm(t.titulo + ' ' + (t.descripcion || '') + ' ' + (t.etiquetas || []).join(' '));
    return busqueda.includes(qnorm);
  }).sort((a, b) => {
    const aScore = norm(a.titulo).includes(qnorm) ? 10 : 1;
    const bScore = norm(b.titulo).includes(qnorm) ? 10 : 1;
    return bScore - aScore;
  });
}

// Renderizar listado
function render() {
  const publicados = st.tutoriales.filter(t => t.estado === 'publicado');

  // Categorías
  const cats = new Set();
  publicados.forEach(t => { if (t.categoria) cats.add(t.categoria); });
  const catDom = document.getElementById('categoryContainer');
  catDom.innerHTML = '';
  [...cats].sort().forEach(cid => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (st.filtros.cat === cid ? ' active' : '');
    chip.textContent = st.categoryIdx[cid]?.nombre || cid;
    chip.onclick = () => {
      st.filtros.cat = st.filtros.cat === cid ? '' : cid;
      render();
    };
    catDom.appendChild(chip);
  });

  // Resultados
  let resultados = search(st.filtros.q);
  if (st.filtros.cat) resultados = resultados.filter(t => t.categoria === st.filtros.cat);

  const main = document.getElementById('main');
  if (!resultados.length) {
    main.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📺</div>' +
      '<h2 class="empty-state-title">Sin resultados</h2>' +
      '<p class="empty-state-text">Intenta con otra búsqueda o categoría</p>' +
      '<button class="btn-primary" onclick="document.getElementById(\'searchInput\').value=\'\'; location.hash=\'#/\'; render();">Limpiar</button></div>';
    return;
  }

  main.innerHTML = '<div class="result-count">' + resultados.length + ' tutorial' + (resultados.length !== 1 ? 's' : '') + '</div>' +
    '<div class="result-list">' + resultados.map(t => `
    <div class="card" onclick="openFicha('${esc(t.id)}')">
      <div class="card-thumb">
        <img src="${t.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 9%27%3E%3Crect fill=%27%23000%27 width=%2716%27 height=%279%27/%3E%3C/svg%3E'}" alt="">
        <div class="card-thumb-overlay"></div>
      </div>
      <div class="card-category">${esc(st.categoryIdx[t.categoria]?.nombre || t.categoria || 'Sin categoría')}</div>
      <h3 class="card-title">${esc(t.titulo)}</h3>
      <p class="card-desc">${esc((t.descripcion || 'Sin descripción').substring(0, 60))}</p>
      <div class="card-tags">${(t.etiquetas || []).slice(0, 3).map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}</div>
    </div>
  `).join('') + '</div>';
}

// Ficha de tutorial
function openFicha(id) {
  const t = st.tutoriales.find(x => x.id === id);
  if (!t) return;
  st.fichaActual = t;

  // Player
  const playerContainer = document.getElementById('playerContainer');
  if (t.video) {
    let iframeHtml = '';
    if (t.video.proveedor === 'drive') {
      iframeHtml = `<iframe src="https://drive.google.com/file/d/${esc(t.video.id)}/preview" allow="fullscreen" loading="lazy"></iframe>`;
    } else if (t.video.proveedor === 'youtube') {
      iframeHtml = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(t.video.id)}?rel=0&modestbranding=1&playsinline=1" allow="fullscreen" loading="lazy"></iframe>`;
    }
    playerContainer.innerHTML = iframeHtml ? `<div class="player">${iframeHtml}</div>` :
      '<div class="player"><div class="player-facade"></div></div>';
  } else {
    playerContainer.innerHTML = '';
  }

  document.getElementById('fichaTitle').textContent = esc(t.titulo);

  let meta = [];
  if (t.categoria) meta.push(st.categoryIdx[t.categoria]?.nombre || t.categoria);
  if (t.duracion_seg) meta.push((Math.floor(t.duracion_seg / 60)) + ' min');
  if (t.fecha) {
    const d = new Date(t.fecha);
    meta.push(d.toLocaleDateString('es-CL'));
  }
  document.getElementById('fichaMeta').textContent = meta.join(' • ');

  document.getElementById('fichaDesc').textContent = t.descripcion || 'Sin descripción';

  let pasos = '';
  if (t.pasos && t.pasos.length) {
    pasos = '<h3 style="font-size:14px; font-weight:700; margin-bottom:8px; color:var(--title);">Pasos</h3>' +
      '<ol style="margin-left:20px; color:var(--txt);">' +
      t.pasos.map(p => `<li style="margin-bottom:6px;">${esc(p)}</li>`).join('') +
      '</ol>';
  }
  document.getElementById('fichaPasos').innerHTML = pasos;

  let acciones = '';
  if (t.video && t.video.proveedor === 'drive') {
    acciones += `<button class="btn-primary" onclick="clip('${esc(`https://drive.google.com/file/d/${t.video.id}/preview`)}')">📋 Copiar enlace</button>`;
  }
  acciones += `<button class="btn-primary" onclick="whatsapp('${esc(t.titulo)}')">💬 Compartir</button>`;
  document.getElementById('fichaAcciones').innerHTML = acciones;

  // Relacionados (misma categoría)
  const relacionados = st.tutoriales.filter(x => x.id !== t.id && x.estado === 'publicado' && x.categoria === t.categoria).slice(0, 3);
  let relHtml = '';
  if (relacionados.length) {
    relHtml = '<h3 style="font-size:14px; font-weight:700; margin-bottom:12px; color:var(--title);">Relacionados</h3>' +
      '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;">' +
      relacionados.map(r => `
        <div class="card" style="padding:12px;" onclick="openFicha('${esc(r.id)}')">
          <div class="card-thumb" style="margin-bottom:8px;">
            <img src="${r.thumbnail || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 9%27%3E%3Crect fill=%27%23000%27 width=%2716%27 height=%279%27/%3E%3C/svg%3E'}" alt="">
            <div class="card-thumb-overlay"></div>
          </div>
          <h4 class="card-title" style="font-size:13px;">${esc(r.titulo.substring(0, 30))}</h4>
        </div>
      `).join('') +
      '</div>';
  }
  document.getElementById('fichaRelacionados').innerHTML = relHtml;

  document.getElementById('ficha').classList.add('open');
  history.pushState(null, '', '#/t/' + t.slug);
}

function closeFicha() {
  document.getElementById('ficha').classList.remove('open');
  st.fichaActual = null;
}

// Acciones
function clip(text) {
  navigator.clipboard?.writeText(text).then(() => {
    alert('Enlace copiado ✓');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Enlace copiado ✓');
  });
}

function whatsapp(titulo) {
  const msg = encodeURIComponent(`Mira este tutorial: ${titulo}\n${window.location.href}`);
  window.open(`https://wa.me/56927690949?text=${msg}`);
}

// Router hash
function handleHash() {
  const hash = window.location.hash.slice(1) || '/';
  if (hash.startsWith('/t/')) {
    const slug = hash.slice(3);
    const t = st.tutoriales.find(x => x.slug === slug);
    if (t) openFicha(t.id);
  }
}

// Events
document.getElementById('searchInput').addEventListener('input', (e) => {
  st.filtros.q = e.target.value;
  render();
});

document.getElementById('gearBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('open');
});

document.getElementById('closeSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('open');
});

document.getElementById('themeDark').addEventListener('click', () => {
  st.tema = 'dark';
  applyTheme();
  document.getElementById('themeDark').classList.add('active');
  document.getElementById('themeLight').classList.remove('active');
});

document.getElementById('themeLight').addEventListener('click', () => {
  st.tema = 'light';
  applyTheme();
  document.getElementById('themeLight').classList.add('active');
  document.getElementById('themeDark').classList.remove('active');
});

['accentGold', 'accentGreen', 'accentBlue'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => {
    st.acento = id.replace('accent', '').toLowerCase();
    applyTheme();
    ['accentGold', 'accentGreen', 'accentBlue'].forEach(x => document.getElementById(x).classList.remove('active'));
    document.getElementById(id).classList.add('active');
  });
});

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  st.install = e;
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (st.install) {
      st.install.prompt();
      st.install = null;
    }
  });
});

window.addEventListener('hashchange', handleHash);

// Iniciar
loadConfig();
loadData();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
